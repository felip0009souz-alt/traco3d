name: Build APK de debug

on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Pacotes do Android SDK
        run: |
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Instalar Godot e templates de exportação
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Configurar Godot (SDK, JDK e keystore de debug)
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore $HOME/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-${GODOT_VERSION}.tres; do
            printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' \
              "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"" \
              "export/android/java_sdk_path = \"$JAVA_HOME\"" \
              "export/android/debug_keystore = \"$HOME/debug.keystore\"" \
              'export/android/debug_keystore_user = "androiddebugkey"' \
              'export/android/debug_keystore_pass = "android"' > ~/.config/godot/$f
          done

      - name: Importar projeto
        run: godot --headless --path . --import || true

      - name: Verificar erros nos scripts
        run: |
          for f in scripts/*.gd; do
            echo "Verificando $f"
            godot --headless --path . --check-only --script res://$f
          done

      - name: Exportar APK de debug
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android Debug" build/traco3d-debug.apk
          ls -l build/

      - uses: actions/upload-artifact@v4
        with:
          name: traco3d-debug-apk
          path: build/traco3d-debug.apk
